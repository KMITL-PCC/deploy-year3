services:

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - projectyear3-network

  gateway:
    image: nginx:alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      # - frontend
    networks:
      - projectyear3-network
      # - frontend-network

  # frontend:
  #   build: ./frontend
  #   environment:
  #     - NEXT_PUBLIC_API_URL=http://localhost/api

  backend:
    image: projectyear3/backendyear3:latest
    # deploy:
    #   replicas: 3
    networks:
      - projectyear3-network

networks:
  projectyear3-network:
    driver: bridge
